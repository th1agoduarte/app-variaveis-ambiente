apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-configuration-management
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: app-configuration-management
  template:
    metadata:
      labels:
        app: app-configuration-management
    spec:
      automountServiceAccountToken: false
      containers:
      - name: app-configuration-management
        image: ghcr.io/th1agoduarte/app-variaveis-ambiente:v1
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
            ephemeral-storage: "512Mi"
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: APP_NAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: APP_NAME
        - name: APP_VERSION
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: APP_VERSION
        - name: APP_AUTHOR
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: APP_AUTHOR
---
apiVersion: v1
kind: Service
metadata:
  name: app-configuration-management
spec:
  selector:
    app: app-configuration-management
  type: NodePort
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
    nodePort: 30000